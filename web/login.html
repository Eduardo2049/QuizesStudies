<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Entrar — Quiz Study</title>
  <meta name="description" content="Acesse sua conta no Quiz Study para realizar simulados interativos e treinar raciocínio lógico.">
  <link rel="stylesheet" href="/web/styles.css?v=2">
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <header class="login-header">
        <p class="eyebrow" id="headerEyebrow">Quiz Study · acesso à plataforma</p>
        <h1 class="login-title" id="headerTitle">Boas-vindas ao<br><em>Quiz Study</em></h1>
        <p class="login-subtitle" id="headerSubtitle">Entre com sua conta para acessar os simulados e acompanhar seu desempenho.</p>
      </header>

      <!-- Alternador de Telas: Login / Cadastro -->
      <nav class="login-tabs" aria-label="Navegação entre login e cadastro">
        <a href="/login" id="tabLogin" class="tab-btn active" aria-current="page">Entrar</a>
        <a href="/register" id="tabRegister" class="tab-btn">Cadastrar</a>
      </nav>

      <!-- Formulário de Login -->
      <form id="pageLoginForm" class="auth-form-card" novalidate>
        <div class="form-group">
          <label for="loginUsername">Usuário</label>
          <input type="text" id="loginUsername" name="username" placeholder="Digite seu usuário" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <div id="loginFeedback" class="form-feedback" hidden></div>

        <button id="btnLoginSubmit" class="primary auth-submit-btn" type="submit">
          <span>Acessar Simulados</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="pageRegisterForm" class="auth-form-card" hidden novalidate>
        <div class="form-group">
          <label for="regUsername">Usuário</label>
          <input type="text" id="regUsername" name="username" placeholder="Escolha um nome de usuário" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" name="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="regPassword">Senha</label>
          <input type="password" id="regPassword" name="password" placeholder="Mínimo de 6 caracteres" required autocomplete="new-password">
        </div>

        <div id="registerFeedback" class="form-feedback" hidden></div>

        <button id="btnRegisterSubmit" class="primary auth-submit-btn" type="submit">
          <span>Criar Conta</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <footer class="login-footer">
        <p class="login-footer-hint" id="footerHint">
          Não possui uma conta? <a href="/register" id="linkToggle" class="auth-link">Cadastre-se aqui</a>
        </p>
      </footer>
    </div>
  </div>

  <script>
    // ─── Verificação da sessão HttpOnly ──────────────────────────────────
    fetch('/api/auth/me', { cache: 'no-store' })
      .then(res => { if (res.ok) window.location.replace('/'); })
      .catch(() => {});

    // ─── Transição Instantânea sem Reload (SPA Navigation) ───────────────
    const pageTitle = document.getElementById('pageTitle');
    const headerEyebrow = document.getElementById('headerEyebrow');
    const headerTitle = document.getElementById('headerTitle');
    const headerSubtitle = document.getElementById('headerSubtitle');
    const tabLogin = document.getElementById('tabLogin');
    const tabRegister = document.getElementById('tabRegister');
    const pageLoginForm = document.getElementById('pageLoginForm');
    const pageRegisterForm = document.getElementById('pageRegisterForm');
    const footerHint = document.getElementById('footerHint');

    function setMode(mode, pushState = true) {
      loginFeedback.hidden = true;
      loginFeedback.textContent = '';
      registerFeedback.hidden = true;
      registerFeedback.textContent = '';

      if (mode === 'register') {
        pageTitle.textContent = 'Cadastrar — Quiz Study';
        headerEyebrow.textContent = 'Quiz Study · crie sua conta';
        headerTitle.innerHTML = 'Cadastro de<br><em>Estudante</em>';
        headerSubtitle.textContent = 'Crie seu perfil gratuitamente para responder simulados e acompanhar seu progresso.';
        tabRegister.classList.add('active');
        tabRegister.setAttribute('aria-current', 'page');
        tabLogin.classList.remove('active');
        tabLogin.removeAttribute('aria-current');
        pageLoginForm.hidden = true;
        pageRegisterForm.hidden = false;
        footerHint.innerHTML = 'Já possui uma conta? <a href="/login" id="linkToggle" class="auth-link">Entre aqui</a>';
        if (pushState && window.location.pathname !== '/register') {
          history.pushState({ mode: 'register' }, '', '/register');
        }
        document.getElementById('regUsername')?.focus();
      } else {
        pageTitle.textContent = 'Entrar — Quiz Study';
        headerEyebrow.textContent = 'Quiz Study · acesso à plataforma';
        headerTitle.innerHTML = 'Boas-vindas ao<br><em>Quiz Study</em>';
        headerSubtitle.textContent = 'Entre com sua conta para acessar os simulados e acompanhar seu desempenho.';
        tabLogin.classList.add('active');
        tabLogin.setAttribute('aria-current', 'page');
        tabRegister.classList.remove('active');
        tabRegister.removeAttribute('aria-current');
        pageRegisterForm.hidden = true;
        pageLoginForm.hidden = false;
        footerHint.innerHTML = 'Não possui uma conta? <a href="/register" id="linkToggle" class="auth-link">Cadastre-se aqui</a>';
        if (pushState && window.location.pathname !== '/login') {
          history.pushState({ mode: 'login' }, '', '/login');
        }
        document.getElementById('loginUsername')?.focus();
      }
    }

    // Navegação pelas abas sem recarregar a página (0ms de atraso, sem reload)
    tabLogin.addEventListener('click', (e) => {
      e.preventDefault();
      setMode('login');
    });

    tabRegister.addEventListener('click', (e) => {
      e.preventDefault();
      setMode('register');
    });

    // Delegação de evento no rodapé para alternar modo sem recarregar a página
    footerHint.addEventListener('click', (e) => {
      const link = e.target.closest('a');
      if (link) {
        e.preventDefault();
        const currentMode = pageRegisterForm.hidden ? 'login' : 'register';
        setMode(currentMode === 'login' ? 'register' : 'login');
      }
    });

    // Suporte aos botões voltar/avançar do navegador
    window.addEventListener('popstate', () => {
      const isRegister = window.location.pathname === '/register';
      setMode(isRegister ? 'register' : 'login', false);
    });

    // ─── Submissão do Formulário de Login ─────────────────────────────────
    const loginFeedback = document.getElementById('loginFeedback');
    const submitLoginBtn = document.getElementById('btnLoginSubmit');

    pageLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginFeedback.hidden = true;
      loginFeedback.textContent = '';

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        loginFeedback.textContent = 'Por favor, preencha o usuário e a senha.';
        loginFeedback.className = 'form-feedback feedback-error';
        loginFeedback.hidden = false;
        return;
      }

      submitLoginBtn.disabled = true;
      submitLoginBtn.classList.add('btn-loading');
      submitLoginBtn.querySelector('span').textContent = 'Validando credenciais…';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const rawData = await response.json();
        const data = rawData.data || rawData;

        if (!response.ok) {
          loginFeedback.textContent = data.message || data.error || 'Usuário ou senha incorretos.';
          loginFeedback.className = 'form-feedback feedback-error';
          loginFeedback.hidden = false;
          return;
        }

        loginFeedback.textContent = '✓ Acesso liberado! Redirecionando…';
        loginFeedback.className = 'form-feedback feedback-success';
        loginFeedback.hidden = false;

        setTimeout(() => {
          window.location.replace('/');
        }, 500);

      } catch (err) {
        loginFeedback.textContent = 'Não foi possível conectar ao servidor. Verifique a conexão.';
        loginFeedback.className = 'form-feedback feedback-error';
        loginFeedback.hidden = false;
      } finally {
        submitLoginBtn.disabled = false;
        submitLoginBtn.classList.remove('btn-loading');
        submitLoginBtn.querySelector('span').textContent = 'Acessar Simulados';
      }
    });

    // ─── Submissão do Formulário de Cadastro ──────────────────────────────
    const registerFeedback = document.getElementById('registerFeedback');
    const submitRegisterBtn = document.getElementById('btnRegisterSubmit');

    pageRegisterForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      registerFeedback.hidden = true;
      registerFeedback.textContent = '';

      const username = document.getElementById('regUsername').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;

      if (!username || !email || !password) {
        registerFeedback.textContent = 'Por favor, preencha todos os campos.';
        registerFeedback.className = 'form-feedback feedback-error';
        registerFeedback.hidden = false;
        return;
      }

      if (password.length < 6) {
        registerFeedback.textContent = 'A senha deve ter no mínimo 6 caracteres.';
        registerFeedback.className = 'form-feedback feedback-error';
        registerFeedback.hidden = false;
        return;
      }

      submitRegisterBtn.disabled = true;
      submitRegisterBtn.classList.add('btn-loading');
      submitRegisterBtn.querySelector('span').textContent = 'Criando cadastro…';

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const rawData = await response.json();
        const data = rawData.data || rawData;

        if (!response.ok) {
          registerFeedback.textContent = data.message || data.error || 'Erro ao criar conta.';
          registerFeedback.className = 'form-feedback feedback-error';
          registerFeedback.hidden = false;
          return;
        }

        registerFeedback.textContent = '✓ Conta criada! Conectando…';
        registerFeedback.className = 'form-feedback feedback-success';
        registerFeedback.hidden = false;

        try {
          const loginRes = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const loginRaw = await loginRes.json();
          const loginData = loginRaw.data || loginRaw;

          if (loginRes.ok) {
            setTimeout(() => {
              window.location.replace('/');
            }, 500);
            return;
          }
        } catch (_) {}

        setMode('login');
        loginFeedback.textContent = '✓ Conta criada com sucesso! Faça login para continuar.';
        loginFeedback.className = 'form-feedback feedback-success';
        loginFeedback.hidden = false;

      } catch (err) {
        registerFeedback.textContent = 'Não foi possível conectar ao servidor. Verifique a conexão.';
        registerFeedback.className = 'form-feedback feedback-error';
        registerFeedback.hidden = false;
      } finally {
        submitRegisterBtn.disabled = false;
        submitRegisterBtn.classList.remove('btn-loading');
        submitRegisterBtn.querySelector('span').textContent = 'Criar Conta';
      }
    });

    // Inicializa baseado na rota atual da URL
    if (window.location.pathname === '/register') {
      setMode('register', false);
    }
  </script>
</body>
</html>
