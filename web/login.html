<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — IFuture Study</title>
  <meta name="description" content="Acesse sua conta no IFuture Study para realizar simulados interativos e treinar raciocínio lógico.">
  <link rel="stylesheet" href="/web/styles.css?v=2">
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <header class="login-header">
        <p class="eyebrow">Quiz Study · acesso à plataforma</p>
        <h1 class="login-title">Boas-vindas ao<br><em>Quiz Study</em></h1>
        <p class="login-subtitle">Entre com sua conta para acessar os simulados e acompanhar seu desempenho.</p>
      </header>

      <!-- Alternador de Telas: Login / Cadastro -->
      <nav class="login-tabs" aria-label="Navegação entre login e cadastro">
        <a href="/login" class="tab-btn active" aria-current="page">Entrar</a>
        <a href="/register" class="tab-btn">Cadastrar</a>
      </nav>

      <!-- Formulário de Login -->
      <form id="pageLoginForm" class="auth-form-card" novalidate>
        <div class="form-group">
          <label for="loginUsername">Usuário</label>
          <input type="text" id="loginUsername" name="username" placeholder="Digite seu usuário" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <div id="loginFeedback" class="form-feedback" hidden></div>

        <button id="btnLoginSubmit" class="primary auth-submit-btn" type="submit">
          <span>Acessar Simulados</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <footer class="login-footer">
        <p class="login-footer-hint">
          Não possui uma conta? <a href="/register" class="auth-link">Cadastre-se aqui</a>
        </p>
      </footer>
    </div>
  </div>

  <script>
    // ─── Verificação com Bearer Token ─────────────────────────────────────
    const token = localStorage.getItem('ifuture_token');

    if (token) {
      fetch('/api/auth/me', {
        headers: { 'Authorization': `Bearer ${token}` },
        cache: 'no-store'
      })
      .then(res => {
        if (res.ok) {
          window.location.replace('/');
        } else {
          localStorage.removeItem('ifuture_token');
        }
      })
      .catch(() => {
        localStorage.removeItem('ifuture_token');
      });
    }

    // ─── Submissão do Formulário de Login ─────────────────────────────────
    const loginForm = document.getElementById('pageLoginForm');
    const loginFeedback = document.getElementById('loginFeedback');
    const submitBtn = document.getElementById('btnLoginSubmit');

    function showFeedback(message, isSuccess = false) {
      loginFeedback.textContent = message;
      loginFeedback.className = `form-feedback ${isSuccess ? 'feedback-success' : 'feedback-error'}`;
      loginFeedback.hidden = false;
    }

    function clearFeedback() {
      loginFeedback.hidden = true;
      loginFeedback.textContent = '';
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearFeedback();

      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!username || !password) {
        showFeedback('Por favor, preencha o usuário e a senha.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.classList.add('btn-loading');
      submitBtn.querySelector('span').textContent = 'Validando credenciais…';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const rawData = await response.json();
        const data = rawData.data || rawData;

        if (!response.ok) {
          showFeedback(data.message || data.error || 'Usuário ou senha incorretos.');
          return;
        }

        if (data.token) {
          localStorage.setItem('ifuture_token', data.token);
        }

        showFeedback(`✓ Acesso liberado! Redirecionando…`, true);

        setTimeout(() => {
          window.location.replace('/');
        }, 500);

      } catch (err) {
        showFeedback('Não foi possível conectar ao servidor. Verifique a conexão.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.classList.remove('btn-loading');
        submitBtn.querySelector('span').textContent = 'Acessar Simulados';
      }
    });
  </script>
</body>
</html>
