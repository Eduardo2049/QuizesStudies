<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Entrar — Quiz Study</title>
  <meta name="description" content="Acesse sua conta no Quiz Study para realizar simulados interativos e treinar raciocínio lógico.">
  <link rel="icon" type="image/svg+xml" href="/web/icons/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/web/icons/favicon-32x32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/web/icons/favicon-16x16.png?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="/web/icons/apple-touch-icon.png?v=2">
  <link rel="shortcut icon" href="/web/icons/favicon.ico?v=2">
  <link rel="stylesheet" href="/web/styles.css?v=22">
  <!-- Script de prevenção de FOUC de tema (execução imediata, bloqueante) -->
  <script src="/web/modules/theme-boot.js"></script>
  <!-- Vercel Web Analytics + Speed Insights (stubs de fila, bloqueantes, antes dos loaders) -->
  <script src="/web/modules/analytics-boot.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <a href="/" class="auth-back-link">
        <svg class="ui-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        Voltar aos simulados
      </a>
      <header class="login-header">
        <div class="login-brand">
          <img src="/web/icons/favicon.svg?v=2" alt="Quiz Study" class="login-brand-icon" width="56" height="56">
        </div>
        <p class="eyebrow" id="headerEyebrow">Quiz Study · acesso à plataforma</p>
        <h1 class="login-title" id="headerTitle">Boas-vindas ao<br><em>Quiz Study</em></h1>
        <p class="login-subtitle" id="headerSubtitle">Entre para salvar seus simulados e acompanhar seu desempenho.</p>
      </header>

      <!-- Alternador de Telas: Login / Cadastro -->
      <nav class="login-tabs" aria-label="Navegação entre login e cadastro">
        <a href="/login" id="tabLogin" class="tab-btn active" aria-current="page">Entrar</a>
        <a href="/register" id="tabRegister" class="tab-btn">Cadastrar</a>
      </nav>

      <!-- Formulário de Login -->
      <form id="pageLoginForm" class="auth-form-card" novalidate>
        <div class="form-group">
          <label for="loginUsername">Usuário</label>
          <input type="text" id="loginUsername" name="username" placeholder="Digite seu usuário" required autocomplete="username" autofocus>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="loginPassword">Senha</label>
            <a href="/reset-password" class="auth-sublink">Esqueci minha senha</a>
          </div>
          <input type="password" id="loginPassword" name="password" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>

        <div id="loginFeedback" class="form-feedback" hidden></div>

        <button id="btnLoginSubmit" class="primary auth-submit-btn" type="submit">
          <span>Entrar na conta</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <!-- Formulário de Cadastro -->
      <form id="pageRegisterForm" class="auth-form-card" hidden novalidate>
        <div class="form-group">
          <label for="regUsername">Usuário</label>
          <input type="text" id="regUsername" name="username" placeholder="Escolha um nome de usuário" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" name="email" placeholder="seuemail@exemplo.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="regPassword">Senha</label>
          <input type="password" id="regPassword" name="password" placeholder="Mínimo de 8 caracteres" required minlength="8" autocomplete="new-password">
        </div>

        <div id="registerFeedback" class="form-feedback" hidden></div>

        <button id="btnRegisterSubmit" class="primary auth-submit-btn" type="submit">
          <span>Criar conta grátis</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <div class="auth-divider" aria-hidden="true"><span>ou</span></div>

      <button id="btnGuestAccess" class="secondary auth-submit-btn auth-guest-btn" type="button">
        Continuar como convidado
      </button>

      <footer class="login-footer">
        <p class="login-footer-hint" id="footerHint">
          Não possui uma conta? <a href="/register" id="linkToggle" class="auth-link">Cadastre-se aqui</a>
        </p>
      </footer>
    </div>
  </div>

  <script type="module" src="/web/modules/backdrop.js?v=7"></script>
  <script type="module" src="/web/modules/auth_page.js?v=6"></script>
</body>
</html>
