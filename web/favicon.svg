<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Fundo elegante no tema Dracula escuro -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f29" />
      <stop offset="100%" stop-color="#282a36" />
    </linearGradient>

    <!-- Borda sutil com brilho roxo (#9767f1) -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9767f1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8be9fd" stop-opacity="0.5" />
    </linearGradient>
  </defs>

  <!-- Base Squircle com contraste de alta nitidez em qualquer tema de navegador -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Círculo do 'Q' em Ciano Drácula (#8be9fd) -->
  <circle cx="30" cy="29" r="16" fill="none" stroke="#8be9fd" stroke-width="4.8" />

  <!-- Cauda do 'Q' em Roxo Claro (#9767f1) com terminação arredondada -->
  <line x1="38" y1="37" x2="49" y2="48" stroke="#9767f1" stroke-width="5.2" stroke-linecap="round" />

  <!-- Checkmark de validação/acerto de quiz no centro em Verde Drácula (#50fa7b) -->
  <polyline points="22,29.5 28,35.5 39,23.5" fill="none" stroke="#50fa7b" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Ponto de conhecimento/iluminação no topo em Amarelo (#f1fa8c) -->
  <circle cx="48" cy="16" r="2.3" fill="#f1fa8c" />
</svg>
