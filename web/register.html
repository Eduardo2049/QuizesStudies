<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title id="pageTitle">Cadastrar — Quiz Study</title>
  <meta name="description" content="Crie sua conta no Quiz Study para realizar simulados interativos e acompanhar seu desempenho.">
  <link rel="icon" type="image/svg+xml" href="/web/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/web/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/web/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/web/apple-touch-icon.png">
  <link rel="shortcut icon" href="/web/favicon.ico">
  <link rel="stylesheet" href="/web/styles.css?v=3">
  <!-- Script de prevenção de FOUC de tema (execução imediata, bloqueante) -->
  <script src="/web/modules/theme-boot.js"></script>
  <!-- Vercel Web Analytics + Speed Insights (stubs de fila, bloqueantes, antes dos loaders) -->
  <script src="/web/modules/analytics-boot.js"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body class="login-body">
  <div class="login-wrapper">
    <div class="login-card">
      <header class="login-header">
        <div class="login-brand">
          <img src="/web/favicon.svg" alt="Quiz Study" class="login-brand-icon" width="56" height="56">
        </div>
        <p class="eyebrow" id="headerEyebrow">Quiz Study · crie sua conta</p>
        <h1 class="login-title" id="headerTitle">Cadastro de<br><em>Estudante</em></h1>
        <p class="login-subtitle" id="headerSubtitle">Crie seu perfil gratuitamente para responder simulados e acompanhar seu progresso.</p>
      </header>

      <!-- Alternador de Telas: Login / Cadastro -->
      <nav class="login-tabs" aria-label="Navegação entre login e cadastro">
        <a href="/login" id="tabLogin" class="tab-btn">Entrar</a>
        <a href="/register" id="tabRegister" class="tab-btn active" aria-current="page">Cadastrar</a>
      </nav>

      <!-- Formulário de Login (Oculto inicialmente na rota /register) -->
      <form id="pageLoginForm" class="auth-form-card" hidden autocomplete="off" novalidate>
        <div class="form-group">
          <label for="loginUsername">Usuário</label>
          <input type="text" id="loginUsername" name="username" placeholder="Digite seu usuário" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="loginPassword">Senha</label>
          <input type="password" id="loginPassword" name="password" placeholder="Digite sua senha" required autocomplete="new-password">
        </div>

        <div id="loginFeedback" class="form-feedback" hidden></div>

        <button id="btnLoginSubmit" class="primary auth-submit-btn" type="submit">
          <span>Acessar Simulados</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <!-- Formulário de Cadastro (Ativo inicialmente na rota /register) -->
      <form id="pageRegisterForm" class="auth-form-card" autocomplete="off" novalidate>
        <div class="form-group">
          <label for="regUsername">Usuário</label>
          <input type="text" id="regUsername" name="username" placeholder="Escolha um nome de usuário" required autocomplete="off" autofocus>
        </div>

        <div class="form-group">
          <label for="regEmail">E-mail</label>
          <input type="email" id="regEmail" name="email" placeholder="seuemail@exemplo.com" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="regPassword">Senha</label>
          <input type="password" id="regPassword" name="password" placeholder="Mínimo de 6 caracteres" required autocomplete="new-password">
        </div>

        <div id="registerFeedback" class="form-feedback" hidden></div>

        <button id="btnRegisterSubmit" class="primary auth-submit-btn" type="submit">
          <span>Criar Conta</span>
          <span class="btn-arrow">→</span>
        </button>
      </form>

      <footer class="login-footer">
        <p class="login-footer-hint" id="footerHint">
          Já possui uma conta? <a href="/login" id="linkToggle" class="auth-link">Entre aqui</a>
        </p>
      </footer>
    </div>
  </div>

  <script type="module" src="/web/modules/auth_page.js"></script>
</body>
</html>
