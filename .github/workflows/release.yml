name: Release — Deploy de Produção

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validação Final (Testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitários
        env:
          DATABASE_URL: ""
          ADMIN_USERNAME: "admin"
          ADMIN_PASSWORD: "ci-test-password-123"
          AI_PROVIDER: "google"
          GEMINI_API_KEY: "fake-key-for-tests"
        run: |
          python -m unittest discover tests -v

  release:
    name: Criar GitHub Release
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extrair informações da tag
        id: tag_info
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "release_name=Release $TAG_NAME" >> $GITHUB_OUTPUT

      - name: Gerar changelog desde a última tag
        id: changelog
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "${{ steps.tag_info.outputs.tag_name }}" ]; then
            CHANGELOG=$(git log --oneline --no-merges -20)
          else
            CHANGELOG=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi
          # Escapa caracteres especiais para multiline output
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag_info.outputs.release_name }}
          body: |
            ## O que mudou

            ${{ steps.changelog.outputs.changes }}

            ---
            *Deploy de produção realizado automaticamente pela Vercel.*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
