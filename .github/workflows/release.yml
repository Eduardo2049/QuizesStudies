name: Release — Deploy de Produção

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Permissões mínimas no topo; o job release sobrescreve com contents: write
permissions:
  contents: read

jobs:
  # ── Validação: tag deve apontar para commit da main ────────────────────────
  validate-tag:
    name: Validar Tag (commit da main)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que a tag está na main
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "$TAG_NAME")
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::A tag $TAG_NAME aponta para um commit que NÃO está na branch main."
            echo "Tags de release devem ser criadas apenas a partir da main."
            exit 1
          fi
          echo "✅ Tag $TAG_NAME validada: commit $TAG_COMMIT pertence à main."

  # ── Testes (reusable workflow com Postgres) ────────────────────────────────
  validate:
    name: Validação Final (Testes)
    needs: validate-tag
    uses: ./.github/workflows/tests.yml
    with:
      python-version: "3.11"

  # ── Criar GitHub Release ───────────────────────────────────────────────────
  release:
    name: Criar GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determinar se é pré-release
        id: pre_release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if echo "$TAG_NAME" | grep -qE '-(rc|beta|alpha|dev)'; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.pre_release.outputs.is_prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
