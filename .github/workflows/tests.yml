name: Testes Python (Reusable)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Versão do Python"
        required: false
        type: string
        default: "3.11"

permissions:
  contents: read

jobs:
  test:
    name: Testes Python
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: quiz_study_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d quiz_study_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes unitários
        env:
          DATABASE_URL: "postgresql://ci_user:ci_password@localhost:5432/quiz_study_test"
          ADMIN_USERNAME: "admin"
          ADMIN_PASSWORD: "ci-test-password-123"
          AI_PROVIDER: "google"
          GEMINI_API_KEY: "fake-key-for-tests"
        run: |
          python -m unittest discover tests -v


