name: CI — Testes e Qualidade

on:
  push:
    branches: [develop, homolog, main]
  pull_request:
    branches: [develop, homolog, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Testes Python com PostgreSQL real ──────────────────────────────────────
  test:
    name: Testes Python
    uses: ./.github/workflows/tests.yml
    with:
      python-version: "3.11"

  # ── Lint e Formatação (ruff) ───────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ruff
        run: pip install ruff

      - name: Lint
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Verificar formatação
        run: ruff format --check .
        continue-on-error: true

  # ── Segurança: Semgrep SAST ────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Semgrep
        uses: semgrep/semgrep-action@v2
        with:
          config: auto

  # ── Segurança: pip-audit (vulnerabilidades em dependências) ────────────────
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências e pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Auditar dependências
        run: pip-audit --strict

  # ── Segurança: gitleaks (segredos vazados no histórico) ────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          wget -qO- "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks

      - name: Executar gitleaks
        run: gitleaks detect --source . --verbose --redact
