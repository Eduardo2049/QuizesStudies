name: CI — Testes e Qualidade

on:
  push:
    branches: [develop, homolog, main]
  pull_request:
    branches: [develop, homolog, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Testes Python com PostgreSQL real ──────────────────────────────────────
  test:
    name: Testes (PostgreSQL)
    uses: ./.github/workflows/tests.yml
    with:
      python-version: "3.11"

  # Gate com o nome EXATO do check obrigatório da branch protection.
  # Jobs que chamam workflow reutilizável são reportados como "<job> / <job chamado>",
  # então o nome "Testes Python" sozinho nunca seria publicado.
  testes-python:
    name: Testes Python
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir que os testes tenham passado
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "Resultado dos testes: $RESULT"
          test "$RESULT" = "success"

  # ── Lint e Formatação (ruff) ───────────────────────────────────────────────
  lint:
    name: Lint & Format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar ruff
        run: pip install ruff

      - name: Lint
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Verificar formatação
        run: ruff format --check .
        continue-on-error: true

  # ── Segurança: Semgrep SAST ────────────────────────────────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Semgrep
        run: >
          semgrep scan
          --config p/python
          --config p/owasp-top-ten
          --config p/dockerfile
          --config p/secrets
          --exclude .github
          --error

  # ── Segurança: pip-audit (vulnerabilidades em dependências) ────────────────
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Instalar pip-audit
        run: pip install pip-audit

      # Audita apenas as dependências do projeto (requirements.txt), e não o
      # pip/setuptools que já vêm no runner e podem ter CVEs fora do nosso controle.
      - name: Auditar dependências
        run: pip-audit -r requirements.txt --strict

  # ── Segurança: gitleaks (segredos vazados no histórico) ────────────────────
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          wget -qO- "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks

      - name: Executar gitleaks
        run: gitleaks detect --source . --verbose --redact
