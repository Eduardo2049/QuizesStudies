version: 2

updates:
  # GitHub Actions — fixar por SHA e manter atualizado
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7

  # Python (pip) — dependências do requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
    cooldown:
      default-days: 7

  # Docker — imagens base no Dockerfile e docker-compose.yml
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 7
