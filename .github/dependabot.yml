version: 2

updates:
  # GitHub Actions — fixar por SHA e manter atualizado
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
    cooldown:
      default-days: 7

  # Python (pip) — dependências do requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "python"
    cooldown:
      default-days: 7

  # Docker — imagens base no Dockerfile e docker-compose.yml
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 7
    # Só correções da mesma série do Python (3.15.x). Troca de série (3.16) é decisão manual:
    # em 16/11/2026 o Dependabot subiu a imagem para a alfa 3.16.0a1.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
