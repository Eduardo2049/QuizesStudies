services:
  postgres:
    image: postgres:16.6-alpine
    container_name: acely_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: quiz_study
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: acely_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/quiz_study
      # IA — OpenRouter, só modelos gratuitos (Google AI Studio desativado por enquanto)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_FREE_MODELS: ${OPENROUTER_FREE_MODELS:-}
      AI_TOKEN_QUOTA_PER_HOUR: ${AI_TOKEN_QUOTA_PER_HOUR:-50000}
      AI_DAILY_CALL_LIMIT: ${AI_DAILY_CALL_LIMIT:-40}
      # Servidor e Segurança
      PORT: 8000
      DEBUG: ${DEBUG:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "127.0.0.1:8080:8000"
    # Hardening de segurança do container
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/quizzes"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: acely_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    profiles:
      - tunnel

volumes:
  postgres_data:
